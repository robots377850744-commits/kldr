<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>廠內定位排程管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #F5FFCD !important;
            color: #27272a !important;
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif !important;
        }

        .fc {
            --fc-border-color: #e4e4e7 !important;
            --fc-page-bg-color: #ffffff !important;
            --fc-neutral-text-color: #52525b !important;
            min-height: 78vh !important; 
        }

        .fc-daygrid-day-frame {
            min-height: 105px !important;
            position: relative !important;
        }
        
        .fc-event { 
            cursor: pointer; 
            padding: 3px 6px !important; 
            font-size: 13px !important;   
            border-radius: 6px !important; 
            margin-bottom: 4px !important; 
            border: none !important;
            display: block !important; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.07);
            transition: transform 0.1s ease;
            position: relative;
            z-index: 5;
        }

        .fc-event:hover {
            transform: scale(1.01);
        }
        .fc-event-title { 
            font-weight: 600 !important; 
            color: #ffffff !important; 
        }
        .fc-daygrid-event-dot { display: none !important; }
        .fc-event-time { display: none !important; }
        
        #passwordOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #F5FFCD; z-index: 9999; display: flex; justify-content: center; align-items: center; 
        }

        .fc .fc-col-header-cell {
            background-color: #fafafa !important;
            padding: 12px 0 !important;
            color: #27272a !important;
            font-weight: 700;
        }
        .fc .fc-daygrid-day-number {
            color: #27272a !important;
            padding: 6px 8px !important;
            font-weight: 600;
            position: relative;
            z-index: 5;
        }
        .fc .fc-day-today {
            background-color: #fefce8 !important;
            border: 2px solid #eab308 !important;
        }
        .fc-day-other {
            opacity: 0.4;
        }
        .fc .fc-toolbar-title {
            color: #27272a !important;
            font-size: 1.4rem !important;
            font-weight: 800 !important;
        }
        @media (min-width: 768px) {
            .fc .fc-toolbar-title { font-size: 1.7rem !important; }
        }
        .fc .fc-button-primary {
            background-color: #ffffff !important;
            border-color: #e4e4e7 !important;
            color: #27272a !important;
            font-weight: 600 !important;
            border-radius: 8px !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
            transition: all 0.2s;
        }
        .fc .fc-button-primary:hover {
            background-color: #f4f4f5 !important;
            border-color: #d4d4d8 !important;
        }

        #customAlertModal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 9998;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #customAlertModal .modal-content {
            background-color: #FFFFFF;
            border: 2px solid #27272a;
            border-radius: 16px;
            width: 100%;
            max-width: 1480px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
            font-size: 16px !important; 
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif !important;
            color: #27272a;
            line-height: 1.6;
        }

        .lp-completed-box {
            background-color: #ecfdf5 !important;
            border-color: #10b981 !important;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2), 0 4px 6px -1px rgba(16, 185, 129, 0.1) !important;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 lg:p-8">

    <div id="passwordOverlay">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border border-zinc-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">🚚 定位系統限制存取</h2>
            <p class="text-sm text-gray-400 mb-6">請輸入密碼解鎖廠內定位排程系統</p>
            <input type="password" id="gatePassword" placeholder="請輸入系統解鎖密碼" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 text-center mb-4 text-gray-800 focus:outline-none focus:ring-2 focus:ring-zinc-400 transition font-semibold">
            <div class="px-1"><button id="unlockBtn" class="w-full bg-zinc-900 hover:bg-black text-white font-bold py-2.5 rounded-xl transition shadow-md">驗證並解鎖</button></div>
            <p id="loginError" class="text-red-500 text-xs mt-3 hidden">⚠️ 密碼錯誤，拒絕存取！</p>
        </div>
    </div>

    <div id="customAlertModal">
        <div class="modal-content p-6">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b-2 border-zinc-200 pb-3 mb-4 gap-2">
                <div class="flex flex-col gap-1">
                    <h3 class="text-lg font-extrabold text-zinc-800" id="modalTitle">📅 定位排程總覽</h3>
                    <div class="text-sm font-bold text-indigo-800 tracking-wide" id="modalStatsTitle"></div>
                </div>
                <button onclick="closeCustomModal()" class="text-zinc-400 hover:text-zinc-800 text-3xl font-bold transition self-end sm:self-center">&times;</button>
            </div>
            <div id="modalBody" class="font-semibold tracking-wide overflow-y-auto max-h-[60vh] pr-1">
            </div>
            <div class="mt-5 border-t border-zinc-100 pt-3 flex flex-wrap justify-between items-center gap-3">
                <button id="modalSaveFieldsBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-5 py-2 rounded-xl transition shadow-md hidden">💾 儲存內容變更</button>
                <button id="modalCopyBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-4 py-2 rounded-xl transition shadow-md hidden">📋 複製並新增為新排程</button>
                <button id="modalDeleteBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold text-sm px-4 py-2 rounded-xl transition shadow-md hidden">🗑️ 刪除此筆排程</button>
                <button onclick="closeCustomModal()" class="bg-zinc-900 hover:bg-black text-white font-bold text-sm px-5 py-2 rounded-xl transition shadow-md ml-auto">關閉視窗</button>
            </div>
        </div>
    </div>

    <div id="mainSystem" class="max-w-[1650px] mx-auto bg-white/95 rounded-2xl shadow-xl p-4 md:p-6 hidden border border-zinc-200/50">
        <!-- 頁首標題區與導航按鈕 -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 pb-4 border-b border-zinc-200">
            <div class="flex items-center gap-2">
                <a href="index.html" class="inline-flex items-center gap-1.5 bg-zinc-800 hover:bg-black text-white font-bold text-xs px-4 py-2 rounded-xl shadow transition">
                    🏗️ 返回：主吊運排程
                </a>
            </div>
            <h1 class="text-2xl font-extrabold text-zinc-800 tracking-wide text-center flex items-center gap-2">
                🚚 廠內定位排程管理系統
            </h1>
            <a href="dashboard.html" class="inline-flex items-center gap-1.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs px-4 py-2 rounded-xl shadow transition">
                📊 轉至：動態儀表板 ➔
            </a>
        </div>

        <!-- 定位排程表單區 -->
        <form id="relocateForm" class="flex flex-col gap-4 bg-zinc-50/90 p-5 rounded-xl mb-6 border border-zinc-200/60 shadow-xs">
            
            <!-- 第一排：【需要信宏協助】前置選項 ＋ 5 大基礎欄位 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 items-end">
                <div class="bg-amber-100/90 border border-amber-300 p-2 rounded-lg flex items-center h-[42px] shadow-2xs">
                    <label class="flex items-center gap-2 cursor-pointer select-none text-xs font-black text-amber-950 w-full">
                        <input type="checkbox" id="needShinHong" class="w-4 h-4 text-amber-600 rounded focus:ring-amber-500 cursor-pointer">
                        <span>🛠️ 需要信宏協助</span>
                    </label>
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 tracking-wider mb-1.5">預約日期</label>
                    <input type="date" id="date" required class="w-full bg-white border border-zinc-200 text-zinc-800 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-zinc-400 transition font-semibold text-xs sm:text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 tracking-wider mb-1.5">樓層</label>
                    <select id="floor" required class="w-full bg-white border border-zinc-200 text-zinc-800 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-zinc-400 transition font-semibold text-xs sm:text-sm">
                        <option value="">-- 請選擇樓層 --</option>
                        <option value="1F">1F</option>
                        <option value="2F">2F</option>
                        <option value="3F">3F</option>
                        <option value="4F">4F</option>
                        <option value="5F">5F</option>
                        <option value="6F">6F</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 tracking-wider mb-1.5">部門 / 站點</label>
                    <select id="department" required class="w-full bg-white border border-zinc-200 text-zinc-800 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-zinc-400 transition font-semibold text-xs sm:text-sm">
                        <option value="">-- 請選擇站點 --</option>
                        <option value="BE/Recon">BE/Recon</option>
                        <option value="RDL">RDL</option>
                        <option value="FC">FC</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 tracking-wider mb-1.5">機台名稱</label>
                    <input type="text" id="machine" placeholder="例如：機台名稱" required class="w-full bg-white border border-zinc-200 text-zinc-800 rounded-lg px-3 py-2 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-400 transition font-semibold text-xs sm:text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-zinc-500 tracking-wider mb-1.5">負責人姓名 / 連絡電話</label>
                    <input type="text" id="workerInfo" placeholder="中文姓名/電話:帥哥28006" required class="w-full bg-white border border-zinc-200 text-zinc-800 rounded-lg px-3 py-2 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-400 transition font-semibold text-xs sm:text-sm">
                </div>
            </div>

            <!-- 第二排：4 大規格欄位（受【需要信宏協助】勾選連動收合/展開） -->
            <div id="specRowContainer" class="hidden border-t border-amber-200/80 pt-3 bg-amber-50/50 p-3 rounded-xl border border-amber-200">
                <div class="text-xs font-black text-amber-900 mb-2 flex items-center gap-1.5">
                    <span>📦 信宏協助機台規格填寫專區：</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-zinc-600 tracking-wider mb-1">件數</label>
                        <input type="number" id="pieces" min="0" placeholder="例如：1" class="w-full bg-white border border-zinc-300 text-zinc-800 rounded-lg px-3 py-2 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-amber-400 transition font-semibold text-xs sm:text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-600 tracking-wider mb-1">淨重總重 (kg)</label>
                        <input type="number" id="netWeight" min="0" placeholder="例如：500" class="w-full bg-white border border-zinc-300 text-zinc-800 rounded-lg px-3 py-2 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-amber-400 transition font-semibold text-xs sm:text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-indigo-900 tracking-wider mb-1">⚙️ 機台最大重量</label>
                        <input type="text" id="mainWeight" placeholder="例如：主機750kg" class="w-full bg-white border border-zinc-300 text-zinc-900 font-bold rounded-lg px-3 py-2 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition text-xs sm:text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-indigo-900 tracking-wider mb-1">📏 尺寸</label>
                        <input type="text" id="mainSize" placeholder="例如：200*150*220" class="w-full bg-white border border-zinc-300 text-zinc-900 font-bold rounded-lg px-3 py-2 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition text-xs sm:text-sm">
                    </div>
                </div>
            </div>

            <!-- 第三排：詳細備註說明（常駐可填） ＋ Loadport 動態標示專區 ＋ 送出按鈕 -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 border-t border-zinc-200/60 pt-3 items-end">
                <div class="lg:col-span-4">
                    <label class="block text-xs font-bold text-zinc-500 tracking-wider mb-1.5">詳細備註說明</label>
                    <input type="text" id="remarks" placeholder="補充備註事項說明..." class="w-full bg-white border border-zinc-200 text-zinc-800 rounded-lg px-3 py-2 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-400 transition font-medium text-xs sm:text-sm">
                </div>

                <!-- Loadport 3 項驗證專區（含動態前置作業已/未完成膠囊徽章） -->
                <div id="lpFormBox" class="lg:col-span-6 bg-zinc-50 border border-zinc-300 p-2.5 rounded-xl transition flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 shadow-2xs">
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span class="text-xs font-black text-indigo-950">🎯 Loadport:</span>
                        <span id="lpStatusBadge" class="text-[10px] font-black px-2 py-0.5 rounded shadow-xs bg-red-100 text-red-700 border border-red-300">
                            前置作業未完成
                        </span>
                    </div>
                    <div class="flex flex-wrap items-center gap-3">
                        <label class="flex items-center gap-1 cursor-pointer select-none text-xs font-bold text-zinc-800">
                            <input type="checkbox" id="lpInitial" class="lp-checkbox w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer">
                            <span>初放定位</span>
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer select-none text-xs font-bold text-zinc-800">
                            <input type="checkbox" id="lpLevel" class="lp-checkbox w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer">
                            <span>水平確認</span>
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer select-none text-xs font-bold text-zinc-800">
                            <input type="checkbox" id="lpLoading" class="lp-checkbox w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer">
                            <span>上下貨位置確認</span>
                        </label>
                    </div>
                </div>

                <div class="lg:col-span-2">
                    <button type="submit" id="submitBtn" class="w-full bg-indigo-900 hover:bg-black text-white font-bold py-2 px-4 rounded-xl transition shadow-md cursor-pointer text-sm h-[42px]">
                        確認定位排程
                    </button>
                </div>
            </div>
        </form>

        <!-- 看板即時篩選 -->
        <div class="bg-zinc-100/80 border border-zinc-200 p-4 rounded-xl mb-4 flex flex-col sm:flex-row gap-4 items-center">
            <div class="flex items-center gap-1.5 shrink-0">
                <span class="text-sm font-black text-zinc-700 tracking-wider">🔍 看板即時篩選：</span>
            </div>
            <div class="grid grid-cols-2 gap-3 w-full sm:w-auto sm:flex sm:flex-row items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-zinc-500">樓層</label>
                    <select id="filterFloor" class="bg-white border border-zinc-300 text-zinc-800 font-semibold rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 transition min-w-[110px]">
                        <option value="ALL">全部樓層</option>
                        <option value="1F">1F</option>
                        <option value="2F">2F</option>
                        <option value="3F">3F</option>
                        <option value="4F">4F</option>
                        <option value="5F">5F</option>
                        <option value="6F">6F</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-zinc-500">站點</label>
                    <select id="filterDept" class="bg-white border border-zinc-300 text-zinc-800 font-semibold rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 transition min-w-[110px]">
                        <option value="ALL">全部站點</option>
                        <option value="BE/Recon">BE/Recon</option>
                        <option value="RDL">RDL</option>
                        <option value="FC">FC</option>
                    </select>
                </div>
                <button id="resetFilterBtn" class="bg-zinc-200 hover:bg-zinc-300 text-zinc-700 font-bold text-xs px-3 py-1.5 rounded-lg transition border border-zinc-300">清除篩選</button>
            </div>
            <div class="text-xs text-zinc-400 sm:ml-auto text-center sm:text-right">
                💡 篩選僅影響您的畫面，不影響雲端資料庫。
            </div>
        </div>

        <div id="calendar" class="p-2 rounded-xl border border-zinc-100 bg-white"></div>

        <!-- 底部控制列 -->
        <div class="mt-6 p-5 bg-zinc-50 rounded-xl border border-zinc-200 flex flex-col gap-4">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 pb-4 border-b border-zinc-200/80">
                <div class="flex flex-wrap items-center gap-3">
                    <div class="text-sm text-zinc-500 font-medium shrink-0">
                        🔑 當前身分：<span id="currentRole" class="font-bold text-zinc-700">一般同仁 (僅能查看/排程)</span>
                    </div>
                    <div class="text-sm font-black text-indigo-700 bg-indigo-50 border border-indigo-200/60 px-3.5 py-1 rounded-xl tracking-wide shadow-xs shrink-0">
                        🚚 雲端定位總排程數：<span id="globalRelocateTotalSpan" class="text-base text-indigo-900 font-black underline decoration-double">0</span> 台
                    </div>
                </div>
                
                <div id="adminLoginArea" class="flex flex-wrap gap-2 items-center w-full lg:w-auto justify-start lg:justify-end">
                    <input type="password" id="adminPassword" placeholder="輸入站點特權金鑰" class="bg-white border border-zinc-200 text-zinc-800 rounded-lg px-3 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400">
                    <button id="adminLoginBtn" class="bg-zinc-800 hover:bg-black text-white text-sm px-4 py-1 rounded-lg transition cursor-pointer">認證特權暗號</button>
                </div>
            </div>

            <!-- 免登入公開報表匯出區 -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 bg-white p-3.5 rounded-xl border border-zinc-200/90 shadow-2xs">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-xs font-black text-zinc-700 shrink-0">📊 免登入報表匯出：</span>
                    <div class="flex items-center gap-1.5 bg-zinc-50 border border-zinc-200 px-2.5 py-1 rounded-lg">
                        <span class="text-xs font-bold text-zinc-500">從</span>
                        <input type="date" id="publicExportStartDate" class="bg-white border border-zinc-300 text-zinc-800 font-bold rounded px-2 py-0.5 text-xs focus:outline-none focus:ring-1 focus:ring-zinc-400">
                        <span class="text-xs font-bold text-zinc-500">至</span>
                        <input type="date" id="publicExportEndDate" class="bg-white border border-zinc-300 text-zinc-800 font-bold rounded px-2 py-0.5 text-xs focus:outline-none focus:ring-1 focus:ring-zinc-400">
                    </div>
                    <button type="button" id="publicExportRangeBtn" class="bg-indigo-700 hover:bg-indigo-800 text-white text-xs px-3.5 py-1.5 rounded-lg transition shadow-xs font-bold cursor-pointer">
                        📥 匯出選定區間報表 (CSV)
                    </button>
                </div>
                <div class="shrink-0 w-full md:w-auto text-right">
                    <button type="button" id="publicExportCsvBtn" class="w-full md:w-auto bg-zinc-700 hover:bg-zinc-800 text-white text-xs px-3.5 py-1.5 rounded-lg transition shadow-xs font-bold cursor-pointer">
                        📥 匯出全定位總報表 (CSV)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const GATE_PASSWORD  = "kl"; 
        const BACKEND_SECRET = "kldriver_secure_key_999"; 

        const ADMIN_PASSWORDS = {

            "RDLkldr": "RDL",
            "FCkldr": "FC",
            "SUPERkldr": "SUPER_ADMIN",
            "XH": "SUPER_ADMIN",
            "XHkldr": "SUPER_ADMIN"

        const firebaseConfig = {

            authDomain: "kldriver.firebaseapp.com",
            projectId: "kldriver",
            storageBucket: "kldriver.firebasestorage.app",

        function isWedOrThu(dateStr) {
            if (!dateStr) return false;
            const parts = dateStr.replace(/\//g, '-').split('-');
            if (parts.length < 3) return false;
            const y = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10) - 1;
            const d = parseInt(parts[2], 10);
            const dt = new Date(y, m, d);
            const day = dt.getDay();
            return (day === 3 || day === 4);
        }

        function isPastDate(targetDateStr) {

            const todayStr = `${dNow.getFullYear()}-${String(dNow.getMonth() + 1).padStart(2, '0')}-${String(dNow.getDate()).padStart(2, '0')}`;
            return targetDateStr.replace(/\//g, '-') < todayStr;

        window.moveRelocateOrder = async function(docId, dateStr, direction) {
            if (currentAdminDept !== "SUPER_ADMIN") return;

            const dayItems = localSchedules
                .filter(item => (item.date || "").replace(/\//g, '-') === dateStr.replace(/\//g, '-'))
                .map((item, idx) => ({ ...item, order_num: parseInt(item.order_num) || (idx + 1) }))
                .sort((a, b) => a.order_num - b.order_num);

            const currentIndex = dayItems.findIndex(i => i.id === docId);
            if (currentIndex === -1) return;

            const targetIndex = direction === 'UP' ? currentIndex - 1 : currentIndex + 1;
            if (targetIndex < 0 || targetIndex >= dayItems.length) return;

            const currentItem = dayItems[currentIndex];
            const targetItem = dayItems[targetIndex];

            let currentOrder = currentItem.order_num;
            let targetOrder = targetItem.order_num;

            if (currentOrder === targetOrder) {
                currentOrder = currentIndex + 1;
                targetOrder = targetIndex + 1;
            }

            try {
                const batch = writeBatch(db);
                batch.update(doc(db, "kldr_relocate", currentItem.id), { order_num: targetOrder });
                batch.update(doc(db, "kldr_relocate", targetItem.id), { order_num: currentOrder });
                await batch.commit();

                openDayOverviewModal(dateStr);
            } catch (err) {
                alert("🚨 調整順序失敗！請檢查權限。");
            }
        };

                        if (dCmp !== 0) return dCmp;
                        return (parseInt(a.order_num) || 999) - (parseInt(b.order_num) || 999);
                    });

                    sorted.forEach((d) => {
                        const localTimeStr = formatToTaiwanTime(d.created_at);
                        const cleanRemarks = (d.remarks || "").replace(/"/g, '""').replace(/\n/g, ' ');
                        const cleanWorker = (d.worker_info || "").replace(/"/g, '""');
                        const cleanMainWeight = (d.main_weight || "").replace(/"/g, '""');
                        const cleanMainSize = (d.main_size || "").replace(/"/g, '""');
                        const orderStr = d.order_num || '1';
                        const shStr = d.need_shinhong ? "是" : "否";
                        const lpDoneStr = (d.lp_initial && d.lp_level && d.lp_loading) ? "已完成" : "未完成";
                        const lpInitStr = d.lp_initial ? "已確認" : "未確認";
                        const lpLvlStr = d.lp_level ? "已確認" : "未確認";
                        const lpLoadStr = d.lp_loading ? "已確認" : "未確認";
                        csvContent += `"${d.date || ''}","${orderStr}","${d.floor || ''}","${d.department || ''}","${d.machine || '未填'}","${cleanWorker}","${shStr}","${lpDoneStr}","${lpInitStr}","${lpLvlStr}","${lpLoadStr}","${d.pieces || ''}","${d.net_weight || ''}","${cleanMainWeight}","${cleanMainSize}","${cleanRemarks}","${localTimeStr}"\n`;
                    });

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", `廠內定位全資料庫總報表_${new Date().toISOString().slice(0,10)}.csv`);
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                } catch (err) { alert("🚨 導出失敗！"); }
            });
        }

        onSnapshot(relocateRef, (snapshot) => {
            globalEventsArray = []; localSchedules = [];
            let totalCount = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.date && data.department) {
                    localSchedules.push({ id: doc.id, ...data }); totalCount++;
                    const colorValue = getDeptColor(data.department);

                    globalEventsArray.push({
                        id: doc.id, 
                        start: data.date, 
                        allDay: true, 
                        backgroundColor: colorValue, 
                        borderColor: colorValue,
                        order_num: parseInt(data.order_num) || 1,
                        extendedProps: { 
                            floor: data.floor || "", 
                            department: data.department, 
                            machine: data.machine, 
                            worker_info: data.worker_info || "",
                            pieces: data.pieces || "",
                            net_weight: data.net_weight || "",
                            main_weight: data.main_weight || "",
                            main_size: data.main_size || "",
                            order_num: parseInt(data.order_num) || 1,
                            need_shinhong: data.need_shinhong || false,
                            lp_initial: data.lp_initial || false,
                            lp_level: data.lp_level || false,
                            lp_loading: data.lp_loading || false,
                            remarks: data.remarks || "" 
                        }
                    });
                }
            });
            document.getElementById('globalRelocateTotalSpan').innerText = totalCount;
            applyLiveFilters(); 
        });

        document.getElementById('filterFloor').addEventListener('change', applyLiveFilters);
        document.getElementById('filterDept').addEventListener('change', applyLiveFilters);
        document.getElementById('resetFilterBtn').addEventListener('click', () => {
            document.getElementById('filterFloor').value = "ALL"; document.getElementById('filterDept').value = "ALL"; applyLiveFilters();
        });

        // 表單提交處理
        const form = document.getElementById('relocateForm');
        form.onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "正在同步...";
            
            const inputDate = document.getElementById('date').value;
            const inputDept = document.getElementById('department').value;
            const inputFloor = document.getElementById('floor').value;

            if (currentAdminDept !== "SUPER_ADMIN" && inputDept === "FC" && isWedOrThu(inputDate) && inputFloor === "1F") {
                alert("🚨 管制規則提醒：每逢週三與週四，FC 站點禁止申請 1F 樓層！請重新選擇其他樓層。");
                btn.disabled = false;
                btn.innerText = "確認定位排程";
                return;
            }

            const isNeedSh = document.getElementById('needShinHong').checked;
            const existingDayItems = localSchedules.filter(item => (item.date || '').replace(/\//g, '-') === inputDate.replace(/\//g, '-'));
            let nextOrder = 1;
            if (existingDayItems.length > 0) {
                const maxOrder = Math.max(...existingDayItems.map(i => parseInt(i.order_num) || 0));
                nextOrder = maxOrder + 1;
            }

            const payload = {
                date: inputDate, 
                floor: inputFloor,
                department: inputDept, 
                machine: document.getElementById('machine').value.trim(), 
                worker_info: document.getElementById('workerInfo').value.trim(),
                pieces: isNeedSh ? document.getElementById('pieces').value.trim() : "",
                net_weight: isNeedSh ? document.getElementById('netWeight').value.trim() : "",
                main_weight: isNeedSh ? document.getElementById('mainWeight').value.trim() : "",
                main_size: isNeedSh ? document.getElementById('mainSize').value.trim() : "",
                order_num: nextOrder,
                need_shinhong: isNeedSh,
                lp_initial: document.getElementById('lpInitial').checked,
                lp_level: document.getElementById('lpLevel').checked,
                lp_loading: document.getElementById('lpLoading').checked,
                remarks: document.getElementById('remarks').value.trim(),
                secret_key: BACKEND_SECRET, 
                created_at: new Date().toISOString()
            };

            try {
                const uniqueId = Date.now() % 100000; 
                const safeDeptName = payload.department.replace('/', '-'); 
                const customDocName = `${payload.date}_${payload.floor}_${safeDeptName}_${uniqueId}`;
                
                await setDoc(doc(db, "kldr_relocate", customDocName), payload);

                alert(`🎉 定位排程已成功同步至雲端（當日序號 #${nextOrder}）！`);
                document.getElementById('machine').value = ''; 
                document.getElementById('workerInfo').value = ''; 
                document.getElementById('pieces').value = ''; 
                document.getElementById('netWeight').value = ''; 
                document.getElementById('mainWeight').value = ''; 
                document.getElementById('mainSize').value = ''; 
                document.getElementById('needShinHong').checked = false;
                specContainer.classList.add('hidden');
                document.getElementById('lpInitial').checked = false;
                document.getElementById('lpLevel').checked = false;
                document.getElementById('lpLoading').checked = false;
                updateFormLpVisual();
                document.getElementById('remarks').value = '';
            } catch (error) { alert('🚨 同步失敗！請檢查權限。'); } finally { btn.disabled = false; btn.innerText = "確認定位排程"; }
        };
    </script>
</body>
</html>
